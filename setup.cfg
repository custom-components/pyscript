[metadata]
license      = Apache License 2.0
license_file = LICENSE
platforms    = any
description  = HASS custom-compontents integration for Python scripting
long_description = file: README.md
keywords     = Home Automation, HASS, HACS, automation
classifier =
    Development Status :: 4 - Beta
    Intended Audience :: End Users/Desktop
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3.13
    Topic :: Home Automation

[tool:pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = .git
log_level=INFO
# -p no:respx lets Home Assistant install its httpx alias before respx is imported
addopts =
    -p no:respx
    --strict-markers
# third-party deprecation warnings raised at import time; not fixable in pyscript
filterwarnings =
    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant\.components\.http\.server
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff\._.*

[mypy]
python_version = 3.14
ignore_errors = true
follow_imports = silent
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true

[codespell]
ignore-words-list = thirdparty
